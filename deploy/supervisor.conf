# /etc/supervisor/conf.d/binary-system.conf
#   sudo supervisorctl reread && sudo supervisorctl update
#
# Queue workers send the member notifications (email/in-app/SMS), run refund
# reversals and announcement broadcasts. They use QUEUE_CONNECTION from .env
# (redis in production). Every deploy runs `artisan queue:restart`: workers
# finish their current job, exit, and supervisor starts them on the new code.

[program:binary-system-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/binary-system/current/artisan queue:work --sleep=3 --tries=3 --backoff=30 --max-time=3600
directory=/var/www/binary-system/current
user=deploy
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/binary-system/shared/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
