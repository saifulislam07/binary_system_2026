name: deploy-smoke

# Rehearses a production deploy on a clean Ubuntu runner, following the
# README: deploy/deploy.sh into an empty APP_DIR, a second (no-migration)
# deploy, /up on the running app, a backup + restore check, and a rollback.

on:
  push:
    branches: [main]
    paths:
      - deploy/**
      - .github/workflows/deploy-smoke.yml
      - composer.lock
      - package-lock.json
      - database/**
      - config/**
  pull_request:
    paths:
      - deploy/**
      - .github/workflows/deploy-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: binary_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_DIR: ${{ github.workspace }}/../server/binary-system

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # deploy.sh mirrors the repository
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, bcmath, gd, exif, zip, intl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Prepare the "server" (README steps 3 and 5)
        run: |
          mkdir -p "$APP_DIR/shared"
          env_file="$APP_DIR/shared/.env"
          cp .env.example "$env_file"
          set_env() { sed -i "s|^$1=.*|$1=$2|" "$env_file"; grep -q "^$1=" "$env_file" || echo "$1=$2" >> "$env_file"; }
          set_env APP_ENV production
          set_env APP_DEBUG false
          set_env APP_URL http://127.0.0.1:8080
          set_env APP_KEY "base64:$(php -r 'echo base64_encode(random_bytes(32));')"
          set_env DB_CONNECTION mysql
          set_env DB_HOST 127.0.0.1
          set_env DB_DATABASE binary_system
          set_env DB_USERNAME root
          set_env DB_PASSWORD root
          set_env SESSION_DRIVER database
          set_env CACHE_STORE database
          set_env QUEUE_CONNECTION database
          set_env MAIL_MAILER log
          set_env PAYMENT_SIMULATOR false
          set_env ADMIN_PASSWORD "$(php -r 'echo bin2hex(random_bytes(12));')"
          chmod 600 "$env_file"

      - name: First deploy into an empty APP_DIR
        run: REPO="file://$GITHUB_WORKSPACE" bash deploy/deploy.sh "$GITHUB_SHA"

      - name: The release is live and healthy
        run: |
          cd "$APP_DIR/current"
          test "$(cat REVISION)" = "$GITHUB_SHA"
          ! php artisan migrate:status --pending --no-ansi | grep -q Pending
          php artisan schedule:list
          php artisan serve --host=127.0.0.1 --port=8080 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/up > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/up > /dev/null
          curl -fsS http://127.0.0.1:8080/login | grep -q 'id="app"'
          curl -fsS http://127.0.0.1:8080/admin/login | grep -q 'Sign in to the admin panel'
          echo "Deployed and serving ${GITHUB_SHA::12}"

      - name: Backup and restore check
        run: |
          cd "$APP_DIR/current"
          php artisan backup:run --disable-notifications
          php artisan backup:verify-restore

      - name: Second deploy (no pending migrations, no maintenance mode)
        run: |
          sleep 1 # release directories are named by the second
          REPO="file://$GITHUB_WORKSPACE" bash deploy/deploy.sh "$GITHUB_SHA" | tee /tmp/deploy2.log
          ! grep -q 'maintenance mode' /tmp/deploy2.log
          test "$(ls -1d "$APP_DIR"/releases/*/ | wc -l)" -eq 2

      - name: Rollback returns to the first release
        run: |
          second="$(readlink -f "$APP_DIR/current")"
          bash deploy/rollback.sh
          test "$(readlink -f "$APP_DIR/current")" != "$second"
          curl -fsS http://127.0.0.1:8080/up > /dev/null
