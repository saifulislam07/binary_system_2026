name: deploy

# Staging: deploys automatically after the `tests` workflow passes on main.
# Production: only by hand (Actions → deploy → Run workflow), and the
# `production` GitHub environment should require a reviewer's approval.
#
# Per-environment secrets (Settings → Environments → staging / production):
#   DEPLOY_HOST          server hostname or IP
#   DEPLOY_USER          ssh user that owns APP_DIR (e.g. deploy)
#   DEPLOY_SSH_KEY       private key for that user (ed25519)
#   DEPLOY_KNOWN_HOSTS   output of `ssh-keyscan -t ed25519 <host>`
#   DEPLOY_PATH          APP_DIR on the server (e.g. /var/www/binary-system)

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: Branch, tag or commit to deploy
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          # Passed through env, never interpolated into the script; deploy.sh validates it too.
          REF: ${{ inputs.ref || github.event.workflow_run.head_sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$DEPLOY_PATH' bash -s -- '$REF'" < deploy/deploy.sh

      - name: Smoke test
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        # /up fails when the database, cache, cron or queue worker is down (see README, "Operations").
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<EOF
          set -e
          cd '$DEPLOY_PATH/current'
          url="\$(grep -E '^APP_URL=' .env | cut -d= -f2- | tr -d '"')"
          curl -fsS "\$url/up" > /dev/null
          echo "GET \$url/up OK — deployed \$(cat REVISION)"
          EOF
